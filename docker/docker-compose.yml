# Local development & test database only. Credentials below are throwaway,
# local-only values and must never be reused anywhere else.
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: tokengo-postgres
    environment:
      POSTGRES_USER: tokengo
      POSTGRES_PASSWORD: tokengo_local_dev_only
      POSTGRES_DB: tokengo
    ports:
      - "55432:5432"   # non-default host port to avoid clashing with any local PostgreSQL
    volumes:
      - tokengo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokengo -d tokengo"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  tokengo-pgdata:
